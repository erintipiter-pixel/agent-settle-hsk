[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# HSK Chain TESTNET ONLY (chainId 133) during the hackathon.
# Mainnet (chainId 177) is intentionally NOT configured anywhere in this
# repo; a mainnet deployment is a post-win claim step decided separately.
[rpc_endpoints]
hsk_testnet = "https://testnet.hsk.xyz"
